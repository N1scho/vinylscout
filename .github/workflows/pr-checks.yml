name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_VERSION: '18.x'

jobs:
  # PR Title Check
  pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
          requireScope: false
        continue-on-error: true

  # Code Quality Checks
  quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter with annotations
        run: npm run lint
        continue-on-error: true

      - name: Check for TODO/FIXME comments
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME" src/ --include="*.js" --include="*.jsx" | wc -l)
          echo "Found $TODO_COUNT TODO/FIXME comments"
          echo "::notice title=Code Comments::Found $TODO_COUNT TODO/FIXME comments"

      - name: Check file sizes
        run: |
          LARGE_FILES=$(find src -type f \( -name "*.js" -o -name "*.jsx" \) -size +30k)
          if [ -n "$LARGE_FILES" ]; then
            echo "::warning title=Large Files::The following files are >30KB:"
            echo "$LARGE_FILES"
          fi

  # Test Coverage Check
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Comment coverage on PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: success()
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP '"total":\s*{\s*"lines":\s*{\s*"pct":\s*\K[0-9.]+' coverage/coverage-summary.json | head -1)
          echo "Test coverage: ${COVERAGE}%"

          if (( $(echo "$COVERAGE < 40" | bc -l) )); then
            echo "::warning title=Low Coverage::Test coverage is ${COVERAGE}% (target: 40%)"
          else
            echo "::notice title=Coverage::Test coverage is ${COVERAGE}% ✓"
          fi
        continue-on-error: true

  # Build Size Check
  build-size:
    name: Build Size Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle size
        run: |
          BUNDLE_SIZE=$(du -sb dist | cut -f1)
          BUNDLE_SIZE_KB=$((BUNDLE_SIZE / 1024))
          BUNDLE_SIZE_MB=$((BUNDLE_SIZE / 1024 / 1024))

          echo "Bundle size: ${BUNDLE_SIZE_MB}MB (${BUNDLE_SIZE_KB}KB)"

          # Check main JS bundle
          MAIN_BUNDLE=$(find dist/assets -name "*.js" -type f ! -name "*worker*" -exec du -b {} + | sort -n | tail -1)
          MAIN_SIZE=$(echo $MAIN_BUNDLE | cut -f1)
          MAIN_SIZE_KB=$((MAIN_SIZE / 1024))

          echo "Main bundle: ${MAIN_SIZE_KB}KB"

          if [ $MAIN_SIZE_KB -gt 500 ]; then
            echo "::warning title=Bundle Size::Main bundle is ${MAIN_SIZE_KB}KB (recommended: <500KB)"
          else
            echo "::notice title=Bundle Size::Main bundle is ${MAIN_SIZE_KB}KB ✓"
          fi

          # Check if size increased significantly
          echo "::notice title=Build Analysis::Total: ${BUNDLE_SIZE_MB}MB, Main: ${MAIN_SIZE_KB}KB"

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit
        run: |
          npm audit --json > audit-report.json || true
          cat audit-report.json | jq '.metadata.vulnerabilities'

      - name: Check for high severity issues
        run: |
          CRITICAL=$(cat audit-report.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit-report.json | jq '.metadata.vulnerabilities.high // 0')
          MODERATE=$(cat audit-report.json | jq '.metadata.vulnerabilities.moderate // 0')

          echo "Security vulnerabilities - Critical: $CRITICAL, High: $HIGH, Moderate: $MODERATE"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "::error title=Security::Found $CRITICAL critical vulnerabilities - please fix before merging"
            exit 1
          fi

          if [ "$HIGH" -gt 0 ]; then
            echo "::warning title=Security::Found $HIGH high severity vulnerabilities"
          fi

          echo "::notice title=Security Audit::No critical vulnerabilities found ✓"

  # Changed Files Analysis
  changes:
    name: Analyze Changed Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v40

      - name: Analyze changes
        run: |
          echo "Changed files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

          # Count changes by type
          JS_COUNT=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '\.(js|jsx)$' | wc -l)
          TEST_COUNT=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '\.test\.(js|jsx)$' | wc -l)
          DOC_COUNT=$(echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' | grep -E '\.md$' | wc -l)

          echo "::notice title=Changes::JavaScript: $JS_COUNT, Tests: $TEST_COUNT, Docs: $DOC_COUNT"

          if [ $JS_COUNT -gt 0 ] && [ $TEST_COUNT -eq 0 ]; then
            echo "::warning title=Tests::Code changes detected but no test files modified"
          fi

  # Auto-label PR
  label-pr:
    name: Auto-label Pull Request
    runs-on: ubuntu-latest

    steps:
      - name: Label based on changed files
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # Summary
  pr-summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    needs: [quality, coverage, build-size, security-scan]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Pull Request Checks Summary"
          echo ""
          echo "- Code Quality: ${{ needs.quality.result }}"
          echo "- Test Coverage: ${{ needs.coverage.result }}"
          echo "- Build Size: ${{ needs.build-size.result }}"
          echo "- Security Scan: ${{ needs.security-scan.result }}"

          if [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "::error::Security scan failed - do not merge"
            exit 1
          fi

          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.build-size.result }}" != "success" ]; then
            echo "::warning::Some checks failed - review before merging"
          fi

          echo "::notice title=PR Checks::Review complete"
